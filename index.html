<!doctype html>
<html lang="en-US">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bokbal — Flappy Rugby</title>
    <link rel="stylesheet" href="style.css" />
    <!-- stylish font for credits -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-wrap">
        <canvas id="game"></canvas>

        <div id="hud">
            <div id="score">0</div>
            <div id="highscore" title="High score" aria-hidden="true">HS: 0</div>
        </div>

        <div id="overlay" class="hidden">
            <div id="overlay-content">
                <h1>Bokbal</h1>
                <p id="final-score">Score: 0</p>
                <p id="highscore-display">High score: 0 — <span id="highscore-name">—</span></p>
                <div id="leaderboard-wrap">
                    <h3>Leaderboard</h3>
                    <ol id="leaderboard"></ol>
                </div>
                <button id="restart" type="button">Restart</button>
            </div>
        </div>

        <!-- start overlay: ask for player name before playing -->
        <div id="start-overlay">
            <div id="start-content">
                <h2>Welcome to Bokbal</h2>
                <p style="margin:6px 0 10px;color:#2b4a3a;">A South African Flappy Bird — Created by Evan Williams</p>
                <label for="player-name">Enter your name</label>
                <input id="player-name" type="text" placeholder="Your name" maxlength="24" />
                <div id="start-info">High score: <span id="stored-highscore">0</span> by <strong id="stored-highname">—</strong></div>
                <button id="start-btn" type="button" onclick="startGame()">Start Game</button>
            </div>
        </div>

        <div id="help">
            <div>Controls: Space / Click / Tap</div>
        </div>
        <div id="credit">Created by Evan Williams</div>
    </div>

    <script src="game.js"></script>
    <!-- Optional: Firebase for shared leaderboard
         To enable shared online leaderboard, create a Firebase project, enable Firestore,
         then add a small inline script setting window.FIREBASE_CONFIG with your config
         (replace the placeholder values). Example:

    <script>
      window.FIREBASE_CONFIG = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT",
        // ...other fields
      };
    </script>

         Also include the Firebase SDK scripts before game.js if you want the client
         to initialize automatically. For convenience you can add these above game.js:
         <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
         <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    -->
</body>
</html>
